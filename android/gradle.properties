# Stockia - Configuration Gradle
# Ce fichier contrôle les paramètres du build Android

# ============================================
# 🚀 PERFORMANCES ET MÉMOIRE
# ============================================

# Augmente la mémoire pour le build (évite les OutOfMemoryError)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Active les builds parallèles (plus rapide sur les machines multi-cœurs)
org.gradle.parallel=true

# Active le cache des builds (accélère les builds suivants)
org.gradle.caching=true

# Garde le daemon Gradle actif entre les builds
org.gradle.daemon=true

# ============================================
# 📱 ANDROID
# ============================================

# Utilise AndroidX (obligatoire pour les nouvelles librairies)
android.useAndroidX=true

# Convertit les anciennes librairies (support) vers AndroidX
android.enableJetifier=true

# Génère les classes R non transitives (réduit la taille)
android.nonTransitiveRClass=true

# Active la génération des BuildConfig (nécessaire pour certaines librairies)
android.defaults.buildfeatures.buildconfig=true

# Désactive la génération des IDs de ressources non finals
android.nonFinalResIds=false

# ============================================
# 🔐 AUTORISER LES PROTOCOLES NON SÉCURISÉS
# ============================================

# 🔑 SOLUTION CLÉ pour react-native-bluetooth-escpos-printer
# Autorise les dépôts HTTP (jcenter) qui n'ont pas de version HTTPS
systemProp.gradle.allowInsecureProtocol=true

# ============================================
# 🎯 KOTLIN
# ============================================

# Style de code officiel Kotlin
kotlin.code.style=official

# Compilation incrémentale Kotlin (plus rapide)
kotlin.incremental=true

# Exécution parallèle des tâches Kotlin
kotlin.parallel.tasks.in.project=true

# ============================================
# 🏗️ EXPO
# ============================================

# Met à jour uniquement les versions majeures d'Expo
expo.onlyVersionMajorUpdates=true

# Utilise la nouvelle synchronisation Reanimated (performances)
expo.useNewReanimatedSynchronization=true

# ============================================
# 🐛 DÉBOGAGE (optionnel - décommenter si besoin)
# ============================================

# Affiche plus de détails pendant le build
# org.gradle.logging.level=info

# Désactive le cache pour déboguer
# org.gradle.caching=false